name: Build Windows EXE & Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save electron electron-builder
      - run: npm run electron:build
      - uses: actions/upload-artifact@v4
        with:
          name: Bunker-P2P-Windows-exe
          path: release/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bunker-P2P-Android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
